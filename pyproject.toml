[project]
name = "libera_cam"
version = "0.3.2"
description = "Libera wide field of view camera L1b algorithm"
authors = [  # Alphabetical
    { name = "Caleb Kumar" },
    { name = "Gavin Medley" },
    { name = "Hong Chen" },
    { name = "Laura Sandoval" },
    { name = "Matt Watwood" },
    { name = "Sebastian Schmidt" }
]
maintainers = [
    { name = "Matt Watwood" },
    { name = "Libera Science Data Center", email = "libera.sdp.support@lists.lasp.colorado.edu" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = [
    "libera",
    "wfov camera",
    "earth science",
    "radiation budget",
    "remote sensing",
    "lasp",
    "university of colorado"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License"
]
# These are the dependencies used in the package metadata when building the project
dependencies = [
    "cloudpathlib[s3]>=0.14.0,<1.0",
    # Both upstreams are pinned to immutable commits on their review branches so a push to either
    # branch cannot change what CI resolves. Restore the release pins before merge:
    # `libera-utils >=5.11.2,<6.0.0` and `lasp-curryer >=0.5.3,<1.0`. TODO[LIBSDC-808]
    #
    # Carries the NetCDF write-path fix (a path rather than an unpicklable file object, which is
    # what lets `h5netcdf` run under the distributed scheduler) and the `chunksizes` tuple
    # coercion that makes chunk shape settable from the product definition
    # (LASP-Libera/libera_utils#66).
    "libera-utils @ git+https://github.com/LASP-Libera/libera_utils.git@5ffcc8872840a61901993181879dd4634fbc2d1a",
    # Imported directly by geolocation.py. Carries `spatial.pixel_geometry`, the `PixelField`
    # registry it selects fields from, and `GeometryData.get_geometry(require_coverage=)`, which the
    # spacecraft-level geometry query relies on to fail on a missing kernel (lasp/curryer#188).
    "lasp-curryer @ git+https://github.com/lasp/curryer.git@7c374fa53635f143f5068e236149b30bad08b027",
    "pyyaml>=6.0.2,<7",
    "matplotlib>=3.10.1",
    "pillow-jpls", # Needed for decompressing JPLS images
    "dask>=2026.1.1",
    "distributed>=2026.1.1",
    "netCDF4>=1.6.0",
    "h5py>=3.0",
]

[tool.poetry.scripts]
libera-cam = 'libera_cam.cli:main'

[tool.poetry]
packages = [
    { include = "libera_cam" }
]
include = [
    "LICENSE.txt",
    "README.md"
]

[tool.poetry.group.dev.dependencies]
# These specs are totally open because they are only needed for developers
moto = {extras = ["s3"], version = "^5.2.1"}
bandit = "*"
pre-commit = "*"
pytest-cov = "*"
pytest-randomly = "*"
pytest-subprocess = "*"
ruff = "*"
pytest-profiling = "*"
memory-profiler = "*"
snakeviz = "*"
bokeh = "*"

[tool.pytest.ini_options]
markers = [
    "integration: mark a test as an integration test. Skip these tests with `pytest -m 'not integration' tests`",
    "profiling: diagnostic L1B profiling smoke test; runs in CI; fails only on uncaught exceptions, not on timing/output checks",
]
minversion = 6.0
xfail_strict = true

[build-system]
requires = ["poetry-core>=2.0.1"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
extend-include = [
    "libera_cam/**/*.py",
    "tests/**/*.py"
]
extend-exclude = [
    "tests/test_data/**",
    "libera_cam/data/**",
    "github_cam/**"
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort import sorting
    "S",  # flake8-bandit security
    "PT",  # flake8-pytest-style
    "UP"  # pyupgrade syntax upgrader
]
per-file-ignores = { "tests/*" = ["S"] }

