attributes:
  ProductID: CAM
  algorithm_version: null

coordinates:
  CAMERA_TIME: # TODO[LIBSDC-707]: Validate that time is unique for each image and can be used as a UID
    dtype: datetime64[ns]
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: >-
        Time of each measurement (UTC) against a base reference of the CCSDS Epoch (January 1, 1958).
        Uniquely identifies each camera sample.
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  ###############
  # Geolocation #
  ###############
  Latitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Geodetic latitude. Coordinate Reference System WGS84
      units: degrees_north
      valid_range: [-90, 90]
      _FillValue: -999 #off Earth
  Terrain_Corrected_Latitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Terrain corrected latitude
      units: degrees_north
      valid_range: [-90, 90]
      _FillValue: -999 #off Earth
  Longitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Longitude. Coordinate Reference System WGS84
      units: degrees_east
      valid_range: [-180, 180]
      _FillValue: -999 #off Earth
  Terrain_Corrected_Longitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Terrain corrected longitude
      units: degrees_east
      valid_range: [-180, 180]
      _FillValue: -999 #off Earth
  Altitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Height above the WGS84 ellipsoid. EPSG:4979
      units: meters
      valid_range: [-1000, 30000]
      _FillValue: -9999
  Terrain_Corrected_Altitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Terrain corrected altitude
      units: meters
      valid_range: [-1000, 30000]
      _FillValue: -9999

  ############
  # Geometry #
  ############
  Solar_Zenith_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Geodetic zenith angle at the Earth point of the Sun
      units: degrees
      valid_range: [0, 180]
      _FillValue: -999
  Relative_Azimuth_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: >-
        Geodetic azimuth angle at the Earth point of the satellite relative to
        the solar plane (measured clockwise in the plane normal to the geodetic zenith)
      units: degrees
      valid_range: [0, 360]
      _FillValue: -999
  Viewing_Zenith_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Geodetic angle at the Earth point to the satellite
      units: degrees
      valid_range: [0, 180]
      _FillValue: -999
  Azimuth:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Detector azimuth angle
      units: degrees
      comment: >-
        FSW-reported commanded instrument azimuth, passed through from L1A
        WFOV_FSW_HEADER_AZIMUTH_ANGLE.
      _FillValue: -999

  ##############
  # Instrument #
  ##############
  Radiometer_Observation_ID:
    dtype: uint16
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: FSW radiometer observation ID
  Camera_Observation_ID:
    dtype: uint16
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: FSW camera observation ID
  Image_Mode:
    dtype: uint8
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: FSW FPGA image processing mode
      comment: >-
        0=DUAL, 1=VIDEO, 2=IMGA, 3=IMGB. Under VIDEO, CAMERA_TIME may duplicate;
        use Camera_Packet_Index as a composite key.
      valid_range: [0, 3]
  Camera_Packet_Index:
    dtype: int32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Originating L1A packet index for each complete image
  Actual_Exposure_Time_1:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: FPGA actual exposure time 1 converted to milliseconds
      units: milliseconds
      comment: >-
        Converted from L1A WFOV_IMAGE_HEADER_ACTUAL_EXP_TIME_1 raw counts using
        ms = (value + 0.43*20) * 129.0 * 0.15625 / 1000.
  Actual_Exposure_Time_2:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: FPGA actual exposure time 2 converted to milliseconds
      units: milliseconds
      comment: >-
        Converted from L1A WFOV_IMAGE_HEADER_ACTUAL_EXP_TIME_2 raw counts using
        ms = (value + 0.43*20) * 129.0 * 0.15625 / 1000. Second exposure in DUAL.
  Exposure_Delta:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: FPGA DELTA_EXP between dual frame requests converted to milliseconds
      units: milliseconds
      comment: >-
        Converted from L1A WFOV_IMAGE_HEADER_DELTA raw counts using
        ms = value * 0.15625 / 1000.

  ###########
  # Science #
  ###########
  Pixel_Counts:
    dtype: uint16
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Original Pixel counts from camera before any corrections
      units: dn
      valid_range: [0, 10000]
  Radiance:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: >-
        Measured, spectrally integrated radiance emerging from the TOA, where the spectral
        integration is weighted by the spectral throughput of the camera's channel (555 nm)
      units: W/(m^2*sr*nm)
      valid_range: [0, 1000]
      _FillValue: -999
  Camera_Mask:
    #If we need to save storage space, this can become a per-image trace to the mask that was applied,
    #rather than the pixel-level bitmask itself (FSW captures this as "Bitmask Mask ID")
    dtype: uint8
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Pixel level mask for data
      valid_range: [0, 1]
  Integration_Time_Flag:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Integration time for camera exposure. 0 for short, 1 for long
      valid_range: [0, 1]
  Quality_Flag:
    dtype: uint32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Bit flags indicating the quality of the data
      value_meaning: TBD. Example file from PREFIRE has this information laid out per-bit using [b0], [b1], etc.
