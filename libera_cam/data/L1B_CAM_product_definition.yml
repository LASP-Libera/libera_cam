attributes:
  ProductID: CAM
  algorithm_version: null
  Earth_Sun_Distance_AU: null

coordinates:
  CAMERA_TIME: # TODO[LIBSDC-707]: Validate that time is unique for each image and can be used as a UID
    dtype: datetime64[ns]
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: >-
        Time of each measurement (UTC) against a base reference of the CCSDS Epoch (January 1, 1958).
        Uniquely identifies each camera sample.
    encoding:
      units: nanoseconds since 1958-01-01
      calendar: standard
      dtype: int64

variables:
  ###############
  # Geolocation #
  ###############
  Latitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Geodetic latitude. Coordinate Reference System WGS84
      units: degrees_north
      valid_range: [-90, 90]
      _FillValue: -999 #off Earth
  Terrain_Corrected_Latitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Terrain corrected latitude
      units: degrees_north
      valid_range: [-90, 90]
      _FillValue: -999 #off Earth
  Longitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Longitude. Coordinate Reference System WGS84
      units: degrees_east
      valid_range: [-180, 180]
      _FillValue: -999 #off Earth
  Terrain_Corrected_Longitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Terrain corrected longitude
      units: degrees_east
      valid_range: [-180, 180]
      _FillValue: -999 #off Earth
  Altitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Height above the WGS84 ellipsoid. EPSG:4979
      units: meters
      valid_range: [-1000, 30000]
      _FillValue: -9999
  Terrain_Corrected_Altitude:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Terrain corrected altitude
      units: meters
      valid_range: [-1000, 30000]
      _FillValue: -9999
  Subsatellite_Latitude:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Latitude of subsatellite point at observation
      units: degrees_north
      valid_range: [-90, 90]
      _FillValue: -999 #off Earth
  Subsatellite_Longitude:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Longitude of subsatellite point at observation
      units: degrees_east
      valid_range: [-180, 180]
      _FillValue: -999 #off Earth
  Subsatellite_Colatitude:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Colatitude of subsatellite point at observation
      units: degrees
      valid_range: [0, 180]
      _FillValue: -999 #off Earth
  Subsolar_Latitude:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Latitude of subsolar point at observation
      units: degrees_north
      valid_range: [-90, 90]
      _FillValue: -999 #off Earth
  Subsolar_Longitude:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Longitude of subsolar point at observation
      units: degrees_east
      valid_range: [-180, 180]
      _FillValue: -999 #off Earth
  Subsolar_Colatitude:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Colatitude of subsolar point at observation
      units: degrees
      valid_range: [0, 180]
      _FillValue: -999 #off Earth

  ############
  # Geometry #
  ############
  Radius_of_Satellite_from_Center_of_Earth:
    dtype: float64
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Radius of the satellite from the center of the Earth
      units: km
      valid_range: [6000, 8000]
      _FillValue: -9999
  Satellite_Position:
    dtype: float64
    dimensions: ["CAMERA_TIME", "EUCLIDEAN_DIM"]
    attributes:
      long_name: >-
        X, Y, and Z components of the satellite inertial position in J2000 Earth-centered inertial reference frame
      units: kilometers
      valid_range: [-8000.0, 8000.0]
      _FillValue: -9999
  Satellite_Velocity:
    dtype: float64
    dimensions: ["CAMERA_TIME", "EUCLIDEAN_DIM"]
    attributes:
      long_name: >-
        X, Y, and Z components of the satellite inertial velocity in J2000 Earth-centered inertial reference frame
      units: km/s
      valid_range: [-10, 10]
      _FillValue: -999
  Satellite_Attitude_Q0:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: The scalar component of the quaternion describing the attitude of the spacecraft interpolated to the camera measurement time in ECEF
      valid_range: [-1, 1]
      _FillValue: -999
  Satellite_Attitude_Q1:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: First component in the quaternion vector describing the attitude of the spacecraft interpolated to the camera measurement time in ECEF
      valid_range: [-1, 1]
      _FillValue: -999
  Satellite_Attitude_Q2:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Second component in the quaternion vector describing the attitude of the spacecraft interpolated to the camera measurement time in ECEF
      valid_range: [-1, 1]
      _FillValue: -999
  Satellite_Attitude_Q3:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Third component in the quaternion vector describing the attitude of the spacecraft interpolated to the camera measurement time in ECEF
      valid_range: [-1, 1]
      _FillValue: -999
  Solar_Zenith_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Geodetic zenith angle at the Earth point of the Sun
      units: degrees
      valid_range: [0, 180]
      _FillValue: -999
  Relative_Azimuth_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: >-
        Geodetic azimuth angle at the Earth point of the satellite relative to
        the solar plane (measured clockwise in the plane normal to the geodetic zenith)
      units: degrees
      valid_range: [0, 360]
      _FillValue: -999
  Viewing_Zenith_Surface:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Geodetic angle at the Earth point to the satellite
      units: degrees
      valid_range: [0, 180]
      _FillValue: -999
  Viewing_Azimuth_Surface_WRT_North:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Libera viewing azimuth angle at the surface with respect to North
      units: degrees
      valid_range: [0, 360]
      _FillValue: -999
  Solar_Azimuth_Surface_WRT_North:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Solar azimuth angle at the surface with respect to North
      units: degrees
      valid_range: [0, 360]
      _FillValue: -999
  Geolocation_Quality_Flag:
    dtype: uint16
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Bit flags from the per-pixel geolocation; 0 where the pixel geometry is good
      value_meaning: >-
        Bits 0-14 are curryer SpatialQualityFlags from the ellipsoid intersection and the surface
        angles. Those this product sets: [b8] no SPICE data for the frame epoch (every field written
        as fill), accompanied by the SPICE error class [b0] no result, [b1] ephemeris missing,
        [b2] attitude missing, [b3] invalid location or [b4] unclassified SPICE error; [b9] the pixel
        line of sight misses the ellipsoid (fill); [b13] Sun position unavailable (solar angles
        fill); [b14] a surface angle was not finite (fill). [b15] geolocation was not run (use_geo
        false).
  Azimuth:
    dtype: float32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Azimuth motor encoder angle from the SPICE CK (LIBERA_BASE_COORD to LIBERA_AZ_COORD)
      units: degrees
      valid_range: [0, 360]
      _FillValue: -999

  ##############
  # Instrument #
  ##############
  Radiometer_Operational_Mode:
    dtype: uint16
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: >-
        Radiometer operational mode (details TBD; indicators for
        nominal, video, dark, LED, lunar cal,
        and maybe something like 'transition' just in case?
      valid_range: [0, 511] #TBC
      _FillValue: 0
  Camera_Operational_Mode:
    dtype: uint16
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: >-
        Camera operational mode (details TBD; indicators for
        nominal, video, dark, LED, lunar cal,
        and maybe something like 'transition' just in case?
      valid_range: [0, 511] #TBC
      _FillValue: 0

  ###########
  # Science #
  ###########
  # TODO[LIBSDC-709]: Add any camera telemetry needed for calibration or L2 processing
  Pixel_Counts:
    dtype: uint16
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Original Pixel counts from camera before any corrections
      units: dn
      valid_range: [0, 10000]
  Radiance:
    dtype: float32
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: >-
        Measured, spectrally integrated radiance emerging from the TOA, where the spectral
        integration is weighted by the spectral throughput of the camera's channel (555 nm)
      units: W/(m^2*sr*nm)
      valid_range: [0, 1000]
      _FillValue: -999
  Camera_Mask:
    #If we need to save storage space, this can become a per-image trace to the mask that was applied,
    #rather than the pixel-level bitmask itself (FSW captures this as "Bitmask Mask ID")
    dtype: uint8
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Pixel level mask for data
      valid_range: [0, 1]
  Integration_Time_Flag:
    dtype: uint8
    dimensions: ["CAMERA_TIME", "CAMERA_PIXEL_COUNT_X", "CAMERA_PIXEL_COUNT_Y"]
    attributes:
      long_name: Integration time for camera exposure. 0 for short, 1 for long
      valid_range: [0, 1]
  Quality_Flag:
    dtype: uint32
    dimensions: ["CAMERA_TIME"]
    attributes:
      long_name: Bit flags indicating the quality of the data
      value_meaning: TBD. Example file from PREFIRE has this information laid out per-bit using [b0], [b1], etc.
